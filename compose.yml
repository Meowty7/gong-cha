services:
  db:
    image: postgres:18.6
    container_name: gongcha_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gongcha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gongcha}
      POSTGRES_DB: ${POSTGRES_DB:-gongcha_cup}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gongcha} -d ${POSTGRES_DB:-gongcha_cup}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
